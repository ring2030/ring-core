<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/webgazer@3.5.3/dist/webgazer.js"></script>
</head>
<body style="margin:0;padding:0;background:transparent;">
    <script>
        window.onerror = function(msg) {
            window.parent.postMessage({ type: 'GAZE_ERROR', message: msg }, '*');
            return false;
        };

        // 親ウィンドウからのキャリブレーション命令を受け取る
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'CALIBRATE') {
                try {
                    webgazer.recordScreenPosition(event.data.x, event.data.y, 'click');
                } catch(e) {}
            }
        });

        window.onload = async function() {
            try {
                if (typeof webgazer === 'undefined') return;

                webgazer.params = webgazer.params || {};
                webgazer.params.saveDataAcrossSessions = true;

                // 親ウィンドウ（メイン画面）へ座標を送信
                webgazer.setGazeListener(function(data) {
                    if (data == null) return;
                    window.parent.postMessage({
                        type: 'GAZE_UPDATE',
                        x: Math.round(data.x),
                        y: Math.round(data.y)
                    }, '*');
                });

                await webgazer.begin();

                // カメラ映像は非表示（iframe が透明なので不要）
                webgazer.showVideo(false);
                webgazer.showPredictionPoints(false);

            } catch (err) {
                window.parent.postMessage({ type: 'GAZE_ERROR', message: err.message }, '*');
            }
        };
    </script>
</body>
</html>
