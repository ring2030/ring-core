<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gaze-core</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
    </style>
    <script>
      // WebGazer以前の生存確認（ここが届けば iframe 通信は生きている）
      (function () {
        function pingHtmlAlive() {
          try {
            window.parent.postMessage({ type: "GAZE_HTML_ALIVE", ts: Date.now() }, "*");
          } catch (e) {
            // ignore
          }
        }

        pingHtmlAlive();
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", pingHtmlAlive);
        }
        window.setInterval(pingHtmlAlive, 1000);
      })();
    </script>
    <script>
      // Best-effort: CDN が 404 を返していないことをコンソールで確認する
      // （ネットワーク状況により必ずしも検出できない点はあります）
      (function () {
        var WEBGAZER_SRC =
          "https://cdn.jsdelivr.net/npm/webgazer@3.5.3/dist/webgazer.js";
        function maybeLog404(status, url) {
          if (status === 404) {
            console.error("[gaze-core] 404 Not Found:", url);
          }
        }
        try {
          fetch(WEBGAZER_SRC, { method: "HEAD" })
            .then(function (r) {
              try {
                maybeLog404(r.status, WEBGAZER_SRC);
              } catch (e) {
                /* ignore */
              }
            })
            .catch(function () {
              /* ignore */
            });
        } catch (e) {
          /* ignore */
        }

        window.addEventListener(
          "error",
          function (ev) {
            var msg = "";
            try {
              msg = String(ev && (ev.message || (ev.error && ev.error.message)) || "");
            } catch (e2) {
              msg = "";
            }
            if (/404/i.test(msg)) {
              console.error("[gaze-core] 404 Not Found (runtime):", msg);
            }
          },
          true,
        );
      })();
    </script>
    <script>
      (function () {
        try {
          if (typeof history === "undefined" || typeof location === "undefined") return;
          var u;
          try {
            u = new URL(location.href);
          } catch (e) {
            return;
          }
          if (!u.searchParams.has("tfjsflags")) {
            u.searchParams.set(
              "tfjsflags",
              "WEBGL_CPU_FORWARD:true,WEBGL_PACK:false,WEBGL_FLUSH_THRESHOLD:-1",
            );
            history.replaceState(history.state, "", u.pathname + u.search + u.hash);
          }
        } catch (e) {
          /* ignore */
        }

        try {
          if (typeof window === "undefined" || window.__kiyokoWebGlGetContextPatched) return;
          window.__kiyokoWebGlGetContextPatched = true;
          var proto = HTMLCanvasElement.prototype;
          var orig = proto.getContext;
          proto.getContext = function (type, attrs) {
            var glTypes = { webgl: 1, webgl2: 1, "experimental-webgl": 1 };
            if (!glTypes[type]) {
              return orig.call(this, type, attrs);
            }
            var merged = Object.assign(
              {},
              attrs || {},
              {
                alpha: false,
                antialias: false,
                depth: false,
                stencil: false,
                premultipliedAlpha: false,
                preserveDrawingBuffer: false,
                powerPreference: "low-power",
                failIfMajorPerformanceCaveat: false,
              },
            );
            try {
              var ctx = orig.call(this, type, merged);
              if (!ctx && type === "webgl2") {
                ctx =
                  orig.call(this, "webgl", merged) ||
                  orig.call(this, "experimental-webgl", merged);
              }
              return ctx;
            } catch (err) {
              return null;
            }
          };
        } catch (e2) {
          /* ignore */
        }
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/webgazer@3.5.3/dist/webgazer.js"></script>
    <script>
      (function () {
        function post(payload) {
          try {
            window.parent.postMessage(payload, "*");
          } catch (e) {
            // ignore
          }
        }

        post({ type: "GAZE_SCRIPT_ENTER" });

        try {
          if (!window.webgazer && typeof webgazer === "undefined") {
            post({ type: "GAZE_ERROR", message: "webgazer is undefined before init" });
            return;
          }

          post({ type: "GAZE_BOOT" });
          window.setInterval(function () {
            post({ type: "GAZE_HEARTBEAT", ts: Date.now() });
          }, 1000);

          webgazer.params = webgazer.params || {};
          webgazer.params.faceMeshSolutionPath =
            "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/";

          webgazer
            .setGazeListener(function (data, elapsedTime) {
              if (data == null) {
                post({ type: "GAZE_NO_DATA" });
                return;
              }
              // これが「インターホンのボタン」です！
              window.parent.postMessage(
                {
                  type: "GAZE_UPDATE",
                  x: Math.round(data.x),
                  y: Math.round(data.y),
                },
                "*",
              );
            })
            .begin()
            .then(function () {
              post({ type: "GAZE_READY" });
              // setGazeListener が動かない環境でも、予測値を定期取得して送る
              window.setInterval(function () {
                try {
                  var maybePrediction = webgazer.getCurrentPrediction();
                  if (maybePrediction && typeof maybePrediction.then === "function") {
                    maybePrediction
                      .then(function (pred) {
                        if (!pred) {
                          post({ type: "GAZE_NO_DATA" });
                          return;
                        }
                        post({
                          type: "GAZE_UPDATE",
                          x: Math.round(pred.x),
                          y: Math.round(pred.y),
                        });
                      })
                      .catch(function () {
                        post({ type: "GAZE_NO_DATA" });
                      });
                    return;
                  }
                  if (!maybePrediction) {
                    post({ type: "GAZE_NO_DATA" });
                    return;
                  }
                  post({
                    type: "GAZE_UPDATE",
                    x: Math.round(maybePrediction.x),
                    y: Math.round(maybePrediction.y),
                  });
                } catch (e) {
                  post({ type: "GAZE_NO_DATA" });
                }
              }, 120);
            })
            .catch(function (err) {
              post({
                type: "GAZE_ERROR",
                message: err && err.message ? err.message : String(err),
              });
            });

          // デバッグ用：送信中であることを画面に表示
          if (typeof webgazer.showVideo === "function") {
            webgazer.showVideo(true).showPredictionPoints(false);
          } else {
            webgazer.showVideoPreview(true).showPredictionPoints(false);
          }
        } catch (e) {
          post({
            type: "GAZE_ERROR",
            message: e && e.message ? e.message : String(e),
          });
        }
      })();
    </script>
  </head>
  <body></body>
</html>
